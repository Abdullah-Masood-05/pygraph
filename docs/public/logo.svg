<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Shield Outline -->
  <path d="M50 5 L88 20 C88 55 50 92 50 92 C50 92 12 55 12 20 Z" fill="url(#innerGrad)" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Graph Nodes and Edges inside Shield -->
  <!-- Edges -->
  <line x1="50" y1="32" x2="32" y2="58" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="32" x2="68" y2="58" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="58" x2="68" y2="58" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" />
  <line x1="50" y1="32" x2="50" y2="68" stroke="#34D399" stroke-width="2" stroke-linecap="round" />

  <!-- Nodes -->
  <circle cx="50" cy="32" r="7" fill="#10B981" stroke="#ECFDF5" stroke-width="2" />
  <circle cx="32" cy="58" r="6" fill="#06B6D4" stroke="#ECFEFF" stroke-width="2" />
  <circle cx="68" cy="58" r="6" fill="#3B82F6" stroke="#EFF6FF" stroke-width="2" />
  <circle cx="50" cy="68" r="5" fill="#34D399" stroke="#ECFDF5" stroke-width="1.5" />
</svg>
