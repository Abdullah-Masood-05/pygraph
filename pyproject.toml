[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pysafe-pickle"
version = "1.0.0"
description = "Safe, fast, schema-evolvable Python object graph serialization powered by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "Abdullah Masood" }]
keywords = ["serialization", "pickle", "rust", "pyo3", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
torch = ["torch>=1.10"]
all = ["numpy>=1.20", "torch>=1.10"]
dev = ["pytest", "hypothesis", "pytest-benchmark"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pygraph._pygraph"
