[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pygraph"
version = "0.1.0"
description = "Safe, fast, schema-evolvable Python object graph serialization powered by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abdullah Masood" }]
keywords = ["serialization", "pickle", "rust", "pyo3", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
torch = ["torch>=1.10"]
all = ["numpy>=1.20", "torch>=1.10"]
dev = ["pytest", "hypothesis", "pytest-benchmark"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pygraph._pygraph"
