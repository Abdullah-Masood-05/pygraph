[package]
name = "pysafe-pickle"
version = "1.2.0"
edition = "2021"
description = "Safe, fast, schema-evolvable Python object graph serialization powered by Rust"
license = "AGPL-3.0-only"

[lib]
name = "_pysafe_pickle"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
rustc-hash = "2"

[profile.release]
lto = true
codegen-units = 1
