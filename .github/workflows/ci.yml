name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Install wheel
        run: pip install pysafe-pickle --find-links dist --no-index

      - name: Verify wheel packages and version parity
        run: |
          python -c "import tomllib, importlib.metadata as m; v = m.version('pysafe-pickle'); assert tomllib.load(open('Cargo.toml','rb'))['package']['version'] == v, f'Cargo.toml version mismatch with {v}'"
          python -c "import pysafe_pickle as psp; import pygraph; assert psp.__version__ == '1.1.0' and pygraph.__version__ == '1.1.0'"

      - name: Install test dependencies
        run: python -m pip install pytest hypothesis pytest-benchmark

      - name: Run Python tests
        run: pytest tests/ -v
